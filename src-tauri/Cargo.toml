[package]
name = "pataka-desktop"
version.workspace = true
description = "Pātaka: a multi-model AI chat client grounded in Māori data sovereignty, with Tūmataiti local redaction"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "pataka_lib"
# Desktop only: a cdylib would exceed the Windows DLL export limit (tokenizers).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pataka-core.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util.workspace = true
reqwest.workspace = true
zeroize.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
tumataiti-rules.workspace = true
url = "2"

[dev-dependencies]
tempfile = "3"
