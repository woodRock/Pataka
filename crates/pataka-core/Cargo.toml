[package]
name = "pataka-core"
description = "Pātaka's engine: Tūmataiti redaction, encrypted store, kaupapa, name model, audit log, guards and the agent proxy. Shared by the desktop app and the pataka command."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util.workspace = true
reqwest.workspace = true
zeroize.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
tumataiti-rules.workspace = true
url = "2"
chacha20poly1305 = { version = "0.10", features = ["std"] }
argon2 = { version = "0.5", features = ["std", "zeroize"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
regex = "1"
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
thiserror = "2"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"] }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
flate2 = "1.1.11"
tar = "0.4.46"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
dirs = "6"
# Pātaka Mail: IMAP over TLS (the same rustls as reqwest) and MIME parsing.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
mail-parser = { version = "0.11", default-features = false }
pdf-extract = "0.12"

[dev-dependencies]
tempfile = "3"
