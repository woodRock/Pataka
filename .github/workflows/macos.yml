# Builds the macOS app on a GitHub-hosted Mac, because Apple's toolchain only
# runs on macOS. Linux and Windows are built locally (scripts/) and committed
# to release/. GitHub-hosted runners are free for public repositories, but
# GitHub will not start any job while the account has a billing lock.
#
# Run it from the Actions tab: "macOS build" → "Run workflow". With "publish"
# ticked, it creates (or updates) the GitHub Release vX.Y.Z with the macOS
# .dmg plus the Linux and Windows installers already committed in release/,
# so https://github.com/woodRock/Pataka/releases/latest has every platform.
name: macOS build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release with the installers for every platform
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build universal .dmg
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      # Actions are pinned to commit SHAs so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Run the checks
        run: scripts/check.sh

      - name: Build
        # Ad-hoc signed. To sign for distribution, add APPLE_SIGNING_IDENTITY and
        # the notarisation secrets (see Tauri's macOS signing guide) and pass them here.
        run: scripts/build-macos.sh

      - name: Checksums
        run: shasum -a 256 release/macos/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pataka-macos
          path: release/macos/
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pataka-macos
          path: release/macos

      - name: Checksums for every platform
        run: scripts/checksums.sh

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          tag="v${version}"
          mapfile -t files < <(find release -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.zip' \) | sort)
          files+=(release/SHA256SUMS)
          cat > notes.md <<EOF
          Pātaka ${version}.

          | Platform | File |
          |---|---|
          | macOS 13+ (Apple silicon and Intel) | \`Pataka_${version}_universal.dmg\` |
          | Windows 10/11 | \`Pataka_${version}_x64-setup.exe\` |
          | Linux (Debian, Ubuntu) | \`Pataka_${version}_amd64.deb\` |
          | Linux (Fedora, openSUSE) | \`Pataka-${version}-1.x86_64.rpm\` |
          | Linux (any) | \`Pataka_${version}_amd64.AppImage\` |

          Verify downloads against \`SHA256SUMS\`. The installers are not code-signed: on macOS, right-click the app and choose Open the first time; on Windows, choose More info → Run anyway.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --title "Pātaka ${version}" --notes-file notes.md
          fi
